name: Deploy to Server
on:
   push:
      branches: [master]
jobs:
   deploy:
      runs-on: ubuntu-latest
      steps:
         - name: Deploy via SSH
           uses: appleboy/ssh-action@v1
           with:
              host: ${{ secrets.SSH_HOST }}
              username: serveradmin
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              script: |
                 cd /data/www/portfolio
                 git pull origin master
